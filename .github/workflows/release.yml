name: Publish Shinro

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: arikchakma/workflows/.github/workflows/release-pnpm.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      publish: true
      build: pnpm --filter shinro build
      publish-directory: packages/shinro
    secrets: inherit
